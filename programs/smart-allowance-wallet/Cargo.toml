[package]
name = "smart-allowance-wallet"
version = "0.1.0"
description = "Programmable wallet with AI-agent sub-wallets and spending policy enforcement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "smart_allowance_wallet"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
